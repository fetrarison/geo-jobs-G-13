    ApiKey:
      type: object
      properties:
        key:
          type: string
        creationDatetime:
          type: string
          format: date-time
    AuthorizedZone:
      type: object
      properties:
        name:
          type: string
        zone:
          $ref: '#/components/schemas/MultiPolygon'
    SingleUserInfo:
      type: object
      properties:
