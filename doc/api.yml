openapi: 3.0.3

info:
  title: Birdia API
  description: |
    Detect and qualify geo-referenced objects.
    
    # Security
    
    Get your **API key** by emailing **contact@birdia.fr**.
    All of your requests must embed your API key in the header named: **x-api-key**.
    
    # Usage
    
    Submit your detection request through `POST /detections/{id}`
    where `{id}` is yours to be created.
    
    1. If your zone is described by a **GeoJson**, then just set accordingly the `geoJsonZone` field in the payload.
    2. If your zone is described by a **Shape file**, then upload it in a second call `POST /detections/{id}/shape`.
    3. If your zone is described by a list of addresses in an **Excel file**, then upload it in a second call `POST /detections/{id}/excel`.
    4. If your zone is described by an **Image**, then upload it in a second call `POST /detections/{id}/image`.
    
    # Examples
    
    ### Detection on roof objects providing geojson multiPolygon
    1. Submit detection request through `POST /detections/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/geojson/detection_toiture_payload_example.json).
    Note that `detectableObjectModel` property must be set to `BP_TOITURE` and `geoServerProperties` property to `null`
    2. Track the progress of your detection through `GET /detections/{id}`. 
    Detection is finished when `geoJsonUrl` property containing your detection result is not null.
    Expected geojson example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/toiture_analysis_result_example.geojson)
    
    ### Detection on roof objects providing excel file containing textual addresses 
    1. Submit detection request through `POST /detections/{id}` where `{id}` is yours to be created
    using the example request body accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/detection_creation_using_toiture_model_example.json). 
    Note that `detectableObjectModel` property must be set to `BP_TOITURE` and `geoServerProperties` property to `null`.
    2. Submit list of addresses contained inside an **Excel file** in a second call `POST /detections/{id}/excel`. 
    Example can be found [here](https://github.com/b-partners/geo-jobs/raw/refs/heads/preprod/examples/detection/excel/excel_addresses_example.xlsx)
    3. Track the progress of your detection through `GET /detections/{id}`. 
    Detection is finished when `geoJsonUrl` property containing your detection result is not null.
    4. Processing time is variable due to address conversion, 
    expected geojson example result is accessible [here](https://raw.githubusercontent.com/b-partners/geo-jobs/refs/heads/preprod/examples/detection/toiture_analysis_result_example.geojson). 

  version: 'latest'

servers:
  - url: 'https://api.birdia.fr'


paths:
  '/ping':
    get:
      operationId: ping
      tags:
        - Health
      responses:
        200:
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
  '/readme/webhook':
    post:
      tags:
        - ReadmeWeb
      operationId: readmeWebhook
      security:
        - ReadmeAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhook'
      responses:
        200:
          description: The user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleUserInfo"
  '/jobs/{id}/annotationProcessing':
    post:
      tags:
        - Tiling
        - MachineDetection
      operationId: processAnnotationJob
      description: |
        Send jobs tiles to bpartners-annotator.
        In case of ZDJ, detected objects are sent with all images.
        In case of ZTJ, only images are sent with empty detected objects.
      parameters:
        - in: path
          name: id
          required: true
          description: ZTJ or ZDJ identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessJobAnnotation'
      responses:
        200:
          description: The created ZTJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationJobProcessing"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/import':
    post:
      tags:
        - Tiling
      operationId: importZTJ
      description: Creates a ZTJ from an external source
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportZoneTilingJob"
      responses:
        200:
          description: The created ZTJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneTilingJob"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs':
    post:
      tags:
        - Tiling
      operationId: tileZone
      description: Creates a ZTJ
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneTilingJob"
      responses:
        200:
          description: The created ZTJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneTilingJob"
        '500':
          $ref: '#/components/responses/500'
    get:
      tags:
        - Tiling
      operationId: getTilingJobs
      description: List all ZTJ
      parameters:
        - in: query
          name: page
          schema:
            $ref: "#/components/schemas/Page"
        - in: query
          name: pageSize
          schema:
            $ref: "#/components/schemas/PageSize"
      responses:
        200:
          description: All ZTJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneTilingJob"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/{id}/recomputedStatus':
    get:
      tags:
        - Tiling
      parameters:
        - in: path
          name: id
          required: true
          description: ZTJ identifier
          schema:
            type: string
      operationId: getRecomputedZTJStatus
      description: Get last recomputed ZTJ status while submitting new recomputing again
      responses:
        200:
          description: The recomputed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/{id}/taskStatistics':
    get:
      tags:
        - Tiling
      parameters:
        - in: path
          name: id
          required: true
          description: ZTJ identifier
          schema:
            type: string
      operationId: getTilingTaskStatistics
      description: Get tiling task statistics for a given ZTJ
      responses:
        200:
          description: List of tiling task statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatistic"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/{id}/taskFiltering':
    post:
      tags:
        - Tiling
      parameters:
        - in: path
          name: id
          required: true
          description: ZTJ identifier
          schema:
            type: string
      operationId: filterTilingTasks
      description: |
        Separate SUCCEEDED tasks into new tiling job from not SUCCEEDED tasks inside another tiling job, for the given ZTJ
      responses:
        200:
          description: |
            List of new tiling jobs with its tasks statuses.
            SUCCEEDED status value means the job contains only SUCCEEDED tasks.
            NOT_SUCCEEDED status value means the job contains only not SUCCEEDED tasks, i.e FAILED or UNKNOWN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FilteredTilingJob"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/{id}/duplications':
    post:
      tags:
        - Tiling
      parameters:
        - in: path
          name: id
          required: true
          description: ZTJ identifier
          schema:
            type: string
      operationId: duplicateTilingJob
      description: Duplicate existing zone tiling job with its tiling tasks and tiles
      responses:
        200:
          description: Duplicated tiling job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneTilingJob"
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/{id}/retry':
    put:
      tags:
        - Tiling
      operationId: processFailedTilingJob
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: ZTJ Identifier
          required: true
      description: Retry failed tasks for a tiling job
      responses:
        200:
          description: The ZTJ with RETRYING health and PROCESSING progression status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneTilingJob"
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
  '/tilingJobs/{id}/parcels':
    get:
      tags:
        - Tiling
      parameters:
        - in: path
          name: id
          required: true
          description: ZTJ identifier
          schema:
            type: string
      operationId: getZTJParcels
      description: List all parcels from a ZTJ
      responses:
        200:
          description: All parcels for given ZTJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TiledParcel"
        '500':
          $ref: '#/components/responses/500'

  '/detectionJobs':
    get:
      tags:
        - MachineDetection
      operationId: getDetectionJobs
      description: List all ZDJ
      parameters:
        - in: query
          name: page
          schema:
            $ref: "#/components/schemas/Page"
        - in: query
          name: pageSize
          schema:
            $ref: "#/components/schemas/PageSize"
      responses:
        200:
          description: All ZDJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneDetectionJob"
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/recomputedStatus':
    get:
      tags:
        - MachineDetection
      parameters:
        - in: path
          name: id
          required: true
          description: ZDJ identifier
          schema:
            type: string
      operationId: getRecomputedZDJStatus
      description: Get last recomputed ZDJ status while submitting new recomputing again
      responses:
        200:
          description: The recomputed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/taskStatistics':
    get:
      tags:
        - MachineDetection
      parameters:
        - in: path
          name: id
          required: true
          description: ZDJ identifier
          schema:
            type: string
      operationId: getDetectionTaskStatistics
      description: Get detection task statistics for a given ZDJ
      responses:
        200:
          description: List of detection task statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatistic"
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/retry':
    put:
      tags:
        - MachineDetection
      operationId: processFailedDetectionJob
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: ZDJ Identifier
          required: true
      description: Retry failed tasks for a detection job
      responses:
        200:
          description: The ZDJ with RETRYING health and PROCESSING progression status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDetectionJob"
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/taskFiltering':
    put:
      tags:
        - MachineDetection
      operationId: filterDetectionTasks
      description: |
        Separate SUCCEEDED tasks into new detection job from not SUCCEEDED tile detection tasks inside another detection job, for the given ZDJ
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: ZDJ Identifier
          required: true
      responses:
        200:
          description: |
            List of new detection jobs with its tasks statuses.
            SUCCEEDED status value means the job contains only SUCCEEDED tasks.
            NOT_SUCCEEDED status value means the job contains only not SUCCEEDED tasks, i.e FAILED or UNKNOWN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FilteredDetectionJob"
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/detectedParcels':
    get:
      tags:
        - MachineDetection
      parameters:
        - in: path
          name: id
          required: true
          description: ZDJ identifier
          schema:
            type: string
      operationId: getZDJParcels
      description: List all detected parcels from a ZTJ
      responses:
        200:
          description: All detected parcels for given ZTJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetectedParcel"
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/geojsonsUrl':
    get:
      tags:
        - MachineDetection
      parameters:
        - in: path
          name: id
          required: true
          description: ZDJ identifier
          schema:
            type: string
      operationId: getZDJGeojsonsUrl
      description: |
        Get a secured URL containing the detection results as geojson.
      responses:
        200:
          description: URL containing detection result as geojson.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonsUrl'
        '500':
          $ref: '#/components/responses/500'
  '/detectionJobs/{id}/process':
    post:
      tags:
        - MachineDetection
      parameters:
        - in: path
          name: id
          required: true
          description: ZDJ identifier
          schema:
            type: string
      operationId: processZDJ
      description: Process a ZDJ
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DetectableObjectConfiguration"
      responses:
        200:
          description: The processed (-ing) ZDJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDetectionJob"
        '500':
          $ref: '#/components/responses/500'
  '/usage':
    get:
      tags:
        - Usage
      operationId: getDetectionUsage
      summary: Get detection usage
      parameters:
        - in: query
          name: surfaceUnit
          required: false
          schema:
            $ref: '#/components/schemas/DetectionSurfaceUnit'
      responses:
        200:
          description: Statistics of detection usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionUsage'
  '/image':
    get:
      tags:
        - Image
      summary: Retrieve aerial image from a textual, human-readable, address
      operationId: getImage
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: query
          name: address
          schema:
            type: string
          required: true
        - in: query
          name: isExtended
          schema:
            type: boolean
            default: false
          required: false
        - in: query
          name: shiftNb
          schema:
            type: integer
            default: 0
          required: false
      responses:
        200:
          description: Image of provided address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageOfAddress'
  '/detections':
    get:
      tags:
        - Detection
      operationId: getDetections
      parameters:
        - in: query
          name: page
          schema:
            $ref: "#/components/schemas/Page"
        - in: query
          name: pageSize
          schema:
            $ref: "#/components/schemas/PageSize"
      responses:
        200:
          description: List of detections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Detection'
  '/detections/{id}':
    get:
      tags:
        - Detection
      operationId: getProcessedDetection
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      responses:
        200:
          description: Detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
    post:
      tags:
        - Detection
      operationId: processDetection
      summary: Create or process detection
      description: |
        Create detection and launch it if `geoJsonZone` provided.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetection'
            examples:
              detectionForRoof:
                $ref: '#/components/examples/DetectionUsingToitureModel'
      responses:
        200:
          description: Detection created or launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/addresses':
    post:
      tags:
        - Detection
      summary: Submit detection over a list of textual addresses
      operationId: detectAddresses
      description: |
        Provide list of textual addresses to launch detection
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdentifierParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Address'
      responses:
        200:
          description: Detection launched with provided textual addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/roofDelimiter':
    post:
      tags:
        - Roof
      summary: Launch detection on delimited roof
      operationId: detectOnDelimitedRoof
      description: |
        Provide roof delimiter used in `BP_TOITURE` model and launches detection.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdentifierParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoofDelimiter'
      responses:
        200:
          description: Detection launched on roof delimiter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/roofer':
    post:
      deprecated: true
      tags:
        - Detection
      operationId: processRooferDetection
      summary: Process detection for roof
      description: |
        This detection is handled synchronously under 30 seconds and used especially for roof under 100 square metre
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetection'
      responses:
        200:
          description: Detection result for roof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/sync':
    post:
      tags:
        - Detection
      operationId: processDetectionSynchronously
      summary: Process detection synchronously
      description: |
        Intended for small areas such as an address, detection tasks are processed simultaneously, delivering results in less than 60 seconds. 
        Results are requested through the GET /detections/{id} endpoint.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdentifierParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetection'
      responses:
        200:
          description: Detection created or processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/roofer/email':
    post:
      tags:
        - Detection
      operationId: sendMailAboutProspect
      summary: Send information about prospect to roofer
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prospect'
      responses:
        200:
          description: Detection result for roof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'

  '/detections/{id}/geojson':
    post:
      tags:
        - Detection
      operationId: detectGeoJson
      summary: Submit detection over retrieved geojson
      description: |
        Provide geojson retrieved from shape file or excel containing textual addresses and launch detection
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        description: File containing list of features retrieved
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection launched with updated geojson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'

  '/detections/{id}/image':
    post:
      tags:
        - Image
      operationId: detectImage
      summary: Submit detection over an image
      description: |
        For security reasons, only image already previously queried from `GET /image` are supported for the moment.
        This ensures that only small enough images are submitted, and that images quality fit the requirements of our AI models.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdentifierParameter'
      requestBody:
        description: Image from a specific textual address to be detected
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection with updated image file uploaded url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'

  '/detections/{id}/pdf':
    post:
      tags:
        - Detection
      summary: Submit PDF containing detection result
      operationId: uploadRooferDetectionPdfResult
      description: |
        Provide PDF containing detection result
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        description: Pdf of the detection result
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection with pdf file containing result uploaded url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/shape':
    post:
      tags:
        - Detection
      operationId: detectShapeFile
      summary: Submit detection over a shape file
      description: |
        Provide shape file to launch detection
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection launched with provided shape file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/detections/{id}/excel':
    post:
      tags:
        - Detection
      operationId: detectExcelFile
      summary: Submit detection over an excel file
      description: |
        Provide excel file containing textual addresses and launch detection.
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Detection identifier
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Detection with updated excel file uploaded url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
  '/parcelization':
    put:
      tags:
        - Parcelization
      parameters:
        - in: query
          name: targetZoom
          schema:
            type: integer
          required: false
        - in: query
          name: referenceZoom
          schema:
            type: integer
          required: false
        - in: query
          name: maxParcelAreaAtReferenceZoom
          schema:
            type: number
          required: false
      operationId: processParcelization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Feature'
      responses:
        '200':
          description: Zone successfully parcelized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
        '500':
          description: Internal Server Error
          $ref: '#/components/responses/500'
  '/api/keys':
    post:
      tags:
        - Security
      operationId: generateApiKeys
      summary: Generate new API keys
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateApiKey'
      responses:
        200:
          description: API keys generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
  '/keys':
    delete:
      tags:
        - Security
      operationId: revokeApiKey
      summary: Revoke all apiKey accesses
      security:
        - ApiKeyAuth: [ ]
      responses:
        200:
          description: Statistics of detection usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeApiKeyResponse'
  /fusionner:
    post:
      summary: Merge polygons from a GeoJSON file and upload the result to S3
      description: |
        Accepts a GeoJSON file as multipart/form-data input, processes the file to merge the polygons,
        then uploads the resulting file to an Amazon S3 bucket. Returns the S3 URL of the uploaded file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - bucket
                - key
              properties:
                file:
                  type: string
                  format: binary
                  description: The input GeoJSON file containing polygons.
                bucket:
                  type: string
                  description: Name of the S3 bucket to upload the result.
                key:
                  type: string
                  description: The key (filename) to use for the uploaded file in the S3 bucket.
      responses:
        '200':
          description: S3 URL of the uploaded merged GeoJSON file.
          content:
            text/plain:
              schema:
                type: string
                example: https://your-bucket.s3.amazonaws.com/output.geojson
        '400':
          description: Bad request (e.g., missing parameters or invalid file)
        '500':
          description: Internal server error during processing or S3 upload
      tags:
        - Polygon Fusion
