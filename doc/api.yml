          type: string
        name:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
    RestException:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
    InternalServerException:
      allOf:
        - $ref: '#/components/schemas/RestException'
