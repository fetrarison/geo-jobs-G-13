openapi: 3.0.3
info:
  title: Polygon Fusion API
  description: API to upload a GeoJSON file, merge polygons, and return the S3 URL of the result.
  version: 1.0.0

paths:
  /fusionner:
    post:
      summary: Merge polygons from a GeoJSON file and upload the result to S3
      description: |
        Accepts a GeoJSON file as multipart/form-data input, processes the file to merge the polygons,
        then uploads the resulting file to an Amazon S3 bucket. Returns the S3 URL of the uploaded file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - bucket
                - key
              properties:
                file:
                  type: string
                  format: binary
                  description: The input GeoJSON file containing polygons.
                bucket:
                  type: string
                  description: Name of the S3 bucket to upload the result.
                key:
                  type: string
                  description: The key (filename) to use for the uploaded file in the S3 bucket.
      responses:
        '200':
          description: S3 URL of the uploaded merged GeoJSON file.
          content:
            text/plain:
              schema:
                type: string
                example: https://your-bucket.s3.amazonaws.com/output.geojson
        '400':
          description: Bad request (e.g., missing parameters or invalid file)
        '500':
          description: Internal server error during processing or S3 upload
      tags:
        - Polygon Fusion
